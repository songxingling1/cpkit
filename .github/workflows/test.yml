name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install C++ compiler (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes g++

      - name: Install C++ compiler (macOS)
        if: runner.os == 'macOS'
        run: xcode-select --install || true

      - name: Install C++ compiler (Windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Add UCRT64 to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run tests
        run: cargo test --all-targets
