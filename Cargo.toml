[package]
name = "cpkit"
version = "0.1.0"
edition = "2024"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
hex = "0.4.3"
humantime = "2.4.0"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full", "test-util"] }
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
mockall = "0.15.0"
predicates = "3.1.4"
tempfile = "3.27.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
] }
