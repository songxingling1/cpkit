[package]
name = "cpkit"
version = "0.1.0"
edition = "2024"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
hex = "0.4.3"
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
toml = "1.1.6"
bon = { workspace = true }
cpkit-task = { path = "./cpkit-task/" }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
libproc = "0.14.11"
mach2 = "0.7.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
rustix = "1.1.5"

[workspace]
resolver = "3"
members = ["cpkit-task"]

[workspace.dependencies]
tokio = "1.53.2"
windows = "0.62.2"
thiserror = "2.0.21"
bon = "3.10.3"
