[package]
name = "cpkit"
version = "0.1.0"
edition = "2024"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full", "test-util"] }
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
mockall = "0.15.0"
predicates = "3.1.4"
tempfile = "3.27.0"
