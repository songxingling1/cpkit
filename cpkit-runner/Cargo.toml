[package]
name = "cpkit-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
atomic-waker = "1.1.2"
crossbeam-channel = "0.5.17"
rustix = { version = "1.1.5", features = ["event", "process"] }
slab = "0.4.12"
tokio = { workspace = true, features = ["process"] }

[target.'cfg(target_os = "windows")'.dependencies]
dashmap = "6.2.1"
windows = { workspace = true, features = [
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
] }
